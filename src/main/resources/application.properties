spring.application.name=picpaysimplificado

# Configurações do Banco H2
spring.datasource.url=jdbc:h2:mem:picpaydb
#;DB_CLOSE_DELAY=-1

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ativa o console do H2 no navegador em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza a estrutura do banco automaticamente com base nas entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

